  lessons/lesson-06-numbers-and-prepositions.md
  lessons/lesson-07-classroom-studies-and-articles.md
  lessons/lesson-08-verbs-b1-and-application.md
  lessons/lesson-09-family-and-possessives.md
  vocabulary/lesson-07.md
  vocabulary/lesson-08.md
  vocabulary/lesson-09.md
  memory/lesson-02-first-pass.md
  memory/lesson-03.md
  memory/lesson-04.md
  memory/lesson-05.md
  memory/lesson-06.md
